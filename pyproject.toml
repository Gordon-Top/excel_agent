[project]
name = "excel-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aerich>=0.8.1",
    "aiofiles>=25.1.0",
    "aiomysql>=0.3.2",
    "cryptography>=49.0.0",
    "e2b-code-interpreter>=2.8,<3",
    "fastapi>=0.138.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "orjson>=3.11.9",
    "pandas>=3.0.3",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "sse-starlette>=3.4.5",
    "tenacity>=9.1.4",
    "tomlkit>=0.15.0",
    "tortoise-orm>=1.1.7",
    "uvicorn>=0.49.0",
]

[[index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.aerich]
tortoise_orm = "app.core.database.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."
